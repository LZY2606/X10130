<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消息目录校验</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e9ef;--mut:#9aa4b2;--ok:#2ea043;--warn:#d29922;--err:#f85149;--acc:#58a6ff;--chip:#21262d}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans",sans-serif;background:var(--bg);color:var(--fg)}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0}
h2{font-size:15px;margin:0 0 10px}
.wrap{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1500px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card.full{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:#21262d;color:var(--fg);border:1px solid #363b46;border-radius:7px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff}
button.danger{border-color:#7d2430;color:#ffb3ae}
input,select,textarea{background:#0d1117;border:1px solid #30363d;color:var(--fg);border-radius:7px;padding:6px 8px;font:inherit}
textarea{width:100%;min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.chip{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px}
.ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)} .mut{color:var(--mut)}
.badge{padding:1px 7px;border-radius:6px;font-size:12px;border:1px solid}
.b-error{border-color:#7d2430;color:#ffb3ae;background:#2d1215}
.b-warn{border-color:#7a5b14;color:#f0c668;background:#2a2110}
.b-ok{border-color:#1f6135;color:#7ee787;background:#10231a}
.b-info{border-color:#1f4d7a;color:#9ecbff;background:#0e1c2e}
pre{background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:340px;font-size:12px}
.toast{position:fixed;right:18px;bottom:18px;max-width:520px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast div{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#1b2029}
.toast .t-ok{border-color:#1f6135} .toast .t-err{border-color:#7d2430} .toast .t-warn{border-color:#7a5b14}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details summary{cursor:pointer;color:var(--acc)}
.snap{font-size:12px;color:var(--mut)}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kvs .mut{color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>消息目录校验</h1>
  <span id="snapLine" class="snap"></span>
  <span style="flex:1"></span>
  <label class="mono mut">受控时间 <input id="clock" size=24 placeholder="2026-10-01T00:00:00Z"></label>
  <button onclick="setClock()">设置时间</button>
  <button onclick="resetClock()">恢复实时</button>
  <button onclick="loadState()">刷新</button>
</header>
<div class="wrap">
__BODY__
</div>
<div class="toast" id="toast"></div>
<script>
__JS__
</script>
</body>
</html>
